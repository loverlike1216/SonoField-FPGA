name: v5 workspace integrity
on:
  pull_request:
  push:
    branches: [main, chore/v5-ax7020-workspace-isolation, 'feat/v5-*', 'codex/v5-historical-*', 'codex/v5-ad7606c16-*', 'codex/v5-hardware-*']
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            v5
            shared
            AI-problem
            AI-chat-memory
            AI-interaction-memory
            .github
            .vscode
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Current structure and inherited copies
        run: |
          python -c "from pathlib import Path; assert not Path('Historical project').exists(), 'Historical worktree must remain absent in routine CI'"
          python v5/scripts/check_structure.py
          python v5/scripts/check_migration.py
          python v5/scripts/check_prepcb_preservation.py
      - name: Hardware design models and independent contract audit (offline)
        env:
          PYTHONPATH: v5
        run: |
          python -m unittest discover -s v5/tests -p test_hardware_design.py -v
          python v5/scripts/validate_hardware_design.py --output v5/build/hardware_ci_validation.json
      - name: Frozen Git metadata and current scope (no historical source read)
        env:
          FREEZE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$FREEZE_BASE" =~ ^0+$ ]]; then
            FREEZE_BASE=$(python -c "import json; print(json.load(open('shared/migration/OLD_TRACKED_MANIFEST.json'))['base_commit'])")
          fi
          python v5/scripts/check_workspace_migration.py --freeze-base "$FREEZE_BASE"
